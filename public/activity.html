<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Activity Logs · Ayaka Sync API</title>
  <meta name="description" content="Activity Logs — Ayaka Sync API dashboard">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark light">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/reveal.js" defer></script>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/config.js"></script>
</head>
<body>
  <a class="sr-only" href="#page">Skip to content</a>
  <div class="app-loading" aria-hidden="true"><span class="spinner"></span></div>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="drawer-scrim" aria-hidden="true"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page" tabindex="-1">
        <div class="page-head">
          <div>
            <h1 class="page-title">Activity Logs</h1>
            <p class="page-sub">An append-only audit trail of security and configuration events on your account. <span class="muted" id="log-total"></span></p>
          </div>
          <div class="page-actions">
            <button class="btn" id="export-csv"><span data-icon="download"></span>Export CSV</button>
          </div>
        </div>

        <section class="card">
          <div class="card-header">
            <div class="toolbar">
              <label class="input-icon"><span class="sr-only">Search logs</span><span data-icon="search"></span><input class="input input-sm" id="log-search" type="search" placeholder="Search description, event or IP" autocomplete="off"></label>
              <select class="select select-sm" id="log-type" aria-label="Event type"><option value="">All events</option></select>
              <input class="input input-sm" type="date" id="log-start" aria-label="From date" style="width:auto">
              <span class="muted" style="font-size:var(--text-xs)">to</span>
              <input class="input input-sm" type="date" id="log-end" aria-label="To date" style="width:auto">
            </div>
          </div>
          <div class="table-wrap">
            <table class="table stack">
              <thead><tr><th>Event</th><th>Type</th><th>IP address</th><th>Time</th></tr></thead>
              <tbody id="log-body"></tbody>
            </table>
          </div>
          <div class="card-footer" id="log-pagination"></div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="assets/js/activity.js"></script>
</body>
</html>
